name: Update page

# Daily: crawl and deploy site/ to Vercel as results come in. Needs repository secrets
# VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID (see README).
on:
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The previously published data.json carries "first seen" dates over, so
      # the page can mark forms that are new since the last run. --publish
      # redeploys the page every minute while the crawl runs, and once at the end.
      - name: Find reviewer forms and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 find_forms.py --no-notify --no-open --publish ./deploy.sh ${SITE_URL:+--previous "$SITE_URL/data.json"}
