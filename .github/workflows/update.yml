name: Update page

# Daily: crawl, then deploy site/ to Vercel. Needs repository secrets
# VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID (see README).
on:
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The previously published data.json carries "first seen" dates over, so
      # the page can mark forms that are new since the last run.
      - name: Find reviewer forms
        run: python3 find_forms.py --no-notify --no-open ${SITE_URL:+--previous "$SITE_URL/data.json"}
      - name: Deploy to Vercel
        run: npx --yes vercel@50.17.1 deploy site --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
