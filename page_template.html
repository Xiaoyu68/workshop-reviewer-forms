<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop Reviewer Calls for Vivian Wang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one soft column of rounded cards; each call carries its workshop date
   as a small ticket on the left, like a sticker on a planner page. */
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --ink: #23304a;
  --muted: #6b7890;
  --line: #dfe6f1;
  --accent: #4864d4;
  --accent-ink: #ffffff;
  --accent-soft: #e5ebfc;
  --soon: #c8602a;
  --soon-soft: #fdebdf;
  --new: #23896a;
  --new-soft: #dcf3ea;
  --shadow: 0 6px 18px -12px rgba(35, 48, 74, 0.28);
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a26; --surface: #1c2433; --ink: #e6ecf6; --muted: #98a5bb; --line: #2c3649;
    --accent: #8ea4ff; --accent-ink: #0f1830; --accent-soft: #263257;
    --soon: #f3a06e; --soon-soft: #3d2719; --new: #6fd3ae; --new-soft: #173a30;
    --shadow: 0 6px 18px -10px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a26; --surface: #1c2433; --ink: #e6ecf6; --muted: #98a5bb; --line: #2c3649;
  --accent: #8ea4ff; --accent-ink: #0f1830; --accent-soft: #263257;
  --soon: #f3a06e; --soon-soft: #3d2719; --new: #6fd3ae; --new-soft: #173a30;
  --shadow: 0 6px 18px -10px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px 64px;
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 8px; }
.hello { font: 600 14px/1 var(--font-display); color: var(--accent); letter-spacing: 0.02em; }
h1 { font: 600 clamp(28px, 5vw, 40px)/1.12 var(--font-display); margin: 0; text-wrap: balance; }
h1 .for { display: block; font-size: 0.62em; color: var(--accent); margin-top: 4px; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.stats b { color: var(--ink); font-weight: 700; }
.progress { display: flex; flex-direction: column; gap: 6px; background: var(--new-soft); color: var(--new); border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.progress .bar { height: 8px; border-radius: 999px; background: var(--surface); overflow: hidden; }
.progress .bar i { display: block; height: 100%; border-radius: inherit; background: var(--new); }

.controls {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  background: var(--bg); padding-block: 10px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.controls input[type="search"], .controls select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; min-width: 0;
}
.controls input[type="search"] { flex: 1 1 220px; }
.controls select { flex: 0 1 auto; max-width: 100%; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.list { display: flex; flex-direction: column; gap: 12px; }
.row {
  display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 16px; align-items: start;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 16px;
  box-shadow: var(--shadow);
}
.stub {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 4px;
  background: var(--accent-soft); color: var(--accent); border-radius: 14px; font-variant-numeric: tabular-nums;
  font-family: var(--font-display);
}
.stub .mon { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
.stub .day { font-size: 26px; font-weight: 600; line-height: 1; color: var(--ink); }
.stub .left { font: 700 11px/1.2 var(--font-body); text-align: center; }
.stub.soon { background: var(--soon-soft); color: var(--soon); }
.stub.unknown { background: var(--new-soft); color: var(--new); }
.stub.unknown .day { font-size: 13px; color: var(--new); text-align: center; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 700 11px/1 var(--font-body); letter-spacing: 0.03em; padding: 5px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.new { background: var(--new-soft); color: var(--new); }
.title { font: 600 17px/1.3 var(--font-display); overflow-wrap: anywhere; }
.title a { color: inherit; text-decoration: none; }
.title a:hover { color: var(--accent); }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
details { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; width: fit-content; font-weight: 600; }
details p { margin: 6px 0 0; padding: 8px 12px; background: var(--bg); border-radius: 12px; overflow-wrap: anywhere; }
.actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.btn {
  display: inline-block; text-align: center; white-space: nowrap; text-decoration: none;
  font: 700 14px/1 var(--font-body); padding: 10px 16px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--accent);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.06); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 18px; }
footer { font-size: 13px; color: var(--muted); max-width: 62ch; }
footer a { color: var(--accent); }

@media (max-width: 600px) {
  .row { grid-template-columns: 64px minmax(0, 1fr); }
  .actions { grid-column: 1 / -1; flex-direction: row; }
  .actions .btn { flex: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .row { transition: transform .15s ease, filter .15s; }
  .row:hover { transform: translateY(-2px); }
  .progress .bar i { transition: width .4s ease; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="hello">Happy reviewing!</span>
    <h1>Workshop Reviewer Calls<span class="for">for Vivian Wang</span></h1>
    <p class="lede">Reviewer sign-up forms for upcoming workshops, found on each workshop's own website. Every form listed here was still accepting responses when it was last checked.</p>
    <div class="stats" id="stats"></div>
    <div class="progress" id="progress" hidden></div>
  </header>

  <div class="controls" role="search">
    <input type="search" id="q" placeholder="Search title, conference, topic…" aria-label="Search">
    <select id="conf" aria-label="Conference"><option value="">All conferences</option></select>
    <select id="sort" aria-label="Sort">
      <option value="date">Workshop date soonest</option>
      <option value="found">Recently found</option>
    </select>
    <label class="toggle"><input type="checkbox" id="newonly"> New only</label>
  </div>

  <div class="list" id="list"></div>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;

const $ = (id) => document.getElementById(id);
const MS_DAY = 86400000;
const today = new Date(new Date().toDateString());
const parse = (s) => (s ? new Date(s + "T00:00:00") : null);
const daysLeft = (d) => Math.round((d - today) / MS_DAY);
const fmt = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "#");

function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}

function boot(data) {
  if (!data) {
    $("list").innerHTML = '<div class="empty">No data yet. Run <code>python3 find_forms.py</code> to build this page.</div>';
    return;
  }
  // Workshops that have taken place since the page was built are dropped.
  const forms = data.forms
    .filter((r) => r.kind === "reviewer")
    .map((r) => ({ ...r, dl: parse(r.deadline), wd: parse(r.start_date), fs: parse(r.first_seen) }))
    .filter((r) => !r.wd || daysLeft(r.wd) >= 0);

  const confs = [...new Set(forms.map((r) => r.conference))].sort();
  $("conf").insertAdjacentHTML("beforeend", confs.map((c) => `<option>${esc(c)}</option>`).join(""));

  const gen = new Date(data.generated);
  $("stats").innerHTML = [
    `<span><b>${forms.length}</b> open reviewer forms</span>`,
    `<span><b>${forms.filter((r) => r.new).length}</b> new since last run</span>`,
    `<span><b>${data.sites}</b> workshop sites checked</span>`,
    `<span>checked <b>${gen.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}</b></span>`,
  ].join("");
  $("foot").innerHTML = `Workshops come from OpenReview. A form counts as a reviewer form when its link text, or the sentence before it, asks for reviewers or program committee members, and it is listed only while Google shows it as accepting responses. ${data.unreachable} sites could not be reached on the last run. Source: <a href="https://github.com/Xiaoyu68/workshop-reviewer-forms" target="_blank" rel="noopener">workshop-reviewer-forms</a>.`;

  // While a crawl is still running, show how far it got and pick up new results.
  if (data.partial) {
    const pct = Math.round((100 * data.sites) / Math.max(1, data.sites_total));
    $("progress").hidden = false;
    $("progress").innerHTML = `<span>Still looking… ${data.sites} of ${data.sites_total} workshop sites checked. This page refreshes itself every minute.</span>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
    setTimeout(() => location.reload(), 60000);
  }

  for (const id of ["q", "conf", "sort"]) {
    const v = store("wrf." + id);
    if (v && [...($(id).options || [{ value: v }])].some((o) => o.value === v)) $(id).value = v;
  }
  if (store("wrf.newonly") === "1") $("newonly").checked = true;

  const far = new Date(9999, 0, 1);
  function render() {
    const q = $("q").value.trim().toLowerCase();
    const conf = $("conf").value, sort = $("sort").value;
    const rows = forms.filter((r) =>
      (!conf || r.conference === conf) &&
      (!$("newonly").checked || r.new) &&
      (!q || (r.title + " " + r.conference + " " + r.context).toLowerCase().includes(q)));
    const cmp = { date: (a, b) => (a.wd || far) - (b.wd || far), found: (a, b) => b.fs - a.fs }[sort];
    rows.sort((a, b) => cmp(a, b) || a.title.localeCompare(b.title));

    $("list").innerHTML = rows.length ? rows.map(card).join("") :
      '<div class="empty">No forms match these filters.</div>';
    for (const id of ["q", "conf", "sort"]) store("wrf." + id, $(id).value);
    store("wrf.newonly", $("newonly").checked ? "1" : "0");
  }

  function card(r) {
    let stub;
    if (r.wd) {
      const n = daysLeft(r.wd);
      const left = n === 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`;
      stub = `<div class="stub${n <= 14 ? " soon" : ""}" title="Workshop ${fmt(r.wd)}">
        <span class="mon">${r.wd.toLocaleDateString("en-US", { month: "short" })}</span>
        <span class="day">${r.wd.getDate()}</span><span class="left">${left}</span></div>`;
    } else {
      stub = `<div class="stub unknown"><span class="mon">Workshop</span><span class="day">date TBA</span></div>`;
    }
    const tags = [`<span class="tag">${esc(r.conference)}</span>`];
    if (r.new) tags.push('<span class="tag new">New</span>');
    const meta = [r.wd ? `Workshop ${fmt(r.wd)}` : null,
                  r.dl ? `paper deadline ${fmt(r.dl)}${daysLeft(r.dl) < 0 ? " (passed)" : ""}` : null,
                  `found ${fmt(r.fs)}`].filter(Boolean).join(" · ");
    return `<article class="row">${stub}
      <div class="body">
        <div class="tags">${tags.join("")}</div>
        <div class="title"><a href="${esc(safeUrl(r.website))}" target="_blank" rel="noopener">${esc(r.title)}</a></div>
        <div class="meta">${meta}</div>
        <details><summary>Text around the link</summary><p>${esc(r.context)}</p></details>
      </div>
      <div class="actions">
        <a class="btn" href="${esc(safeUrl(r.form))}" target="_blank" rel="noopener">Open form ↗</a>
        <a class="btn ghost" href="${esc(safeUrl(r.page))}" target="_blank" rel="noopener">Source page</a>
      </div></article>`;
  }

  for (const id of ["q", "conf", "sort", "newonly"]) $(id).addEventListener("input", render);
  render();
}

if (DATA) boot(DATA);
else fetch("data.json").then((r) => r.json()).then(boot).catch(() => boot(null));
</script>
</body>
</html>
